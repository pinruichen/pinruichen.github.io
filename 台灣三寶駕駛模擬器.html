<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>台灣三寶駕駛模擬器</title>
<style>
:root{--bg:#12161d;--bar:#1b222c;--btn:#2f5bea;--btn2:#e0644a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{height:100dvh;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{touch-action:manipulation}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:none;user-select:none;color:#fff}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}

#lt{position:absolute;top:44px;left:0;right:0;text-align:center;font-size:23px;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none}
#cw{position:absolute;top:86px;left:50%;transform:translateX(-50%);width:max-content;max-width:92%;text-align:center;font-size:19px;font-weight:800;color:#ffe08a;background:rgba(18,22,30,.85);border:2px solid #f2c230;border-radius:999px;padding:6px 18px;pointer-events:none;display:none}
.ov{overflow-y:auto}.rep{margin-top:12px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.1);font-size:14px;text-align:left;max-width:330px;width:100%}.rep div{display:flex;justify-content:space-between;gap:10px}.rep small{display:block;margin-top:6px;opacity:.7;font-size:11px;line-height:1.4}.rep b{color:#ffb4a8}
#ms{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(92%,480px);text-align:center;font-size:15px;line-height:1.45;white-space:pre-line;text-align:left;font-weight:800;color:#d8ffe8;background:rgba(18,22,30,.85);border:2px solid #3ec97a;border-radius:14px;padding:6px 16px;pointer-events:none;display:none}

#mc .mcq{font-weight:800;font-size:14px;color:#ffe08a;margin-bottom:4px}#mc button{display:block;width:100%;margin:5px 0 0;border:0;border-radius:10px;background:#2f5bea;color:#fff;font:inherit;font-size:15px;font-weight:700;padding:9px 10px;cursor:pointer}

.ov>*:first-child{margin-top:auto}.ov>*:last-child{margin-bottom:auto}.ov.cover>*:first-child,#mapov>*:first-child{margin-top:0}
.ov h1{margin:0 0 8px;font-size:30px;line-height:1.25}
.ov p{margin:4px 0;max-width:300px}
.ov .big{font-size:24px;font-weight:700;margin-top:10px}
.ov button{margin-top:18px;border:0;border-radius:12px;background:var(--btn2);color:#fff;font:inherit;font-weight:700;padding:12px 28px;cursor:pointer}
.hide{display:none}
#stage #mm{position:absolute;left:10px;top:46px;width:128px!important;height:128px!important;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(18,22,30,.65);pointer-events:auto;cursor:pointer}
#mmh{position:absolute;left:6px;top:178px;width:140px;text-align:center;font-size:11px;font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none;opacity:.9}
#mapov{justify-content:flex-start;padding:12px;background:rgba(12,15,20,.94)}#mapov h1{font-size:20px;margin:0 0 8px}
.mpw{display:flex;gap:10px;width:100%;max-width:900px;flex-wrap:wrap;justify-content:center}
#stage #bigmap{width:min(94vw,420px)!important;height:min(64vh,640px)!important;max-width:none;border-radius:12px;border:2px solid rgba(255,255,255,.6);flex:none}

#mi-x{position:absolute;right:4px;top:4px;margin:0;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.15);font-size:14px}
.mli{cursor:pointer;border-radius:6px}.mli:hover{background:rgba(255,255,255,.1)}.mlt{color:#9fe8c0;font-size:12px}.mlo{white-space:pre-line;color:#d8ffe8;background:rgba(62,201,122,.15);border-radius:8px;padding:4px 8px!important;margin:4px 0}
#maplist div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.08)}.mlh{font-weight:800;color:#ffe08a}
#nk{margin-top:8px;padding:10px 14px;border-radius:12px;border:2px solid #f2c230;background:rgba(255,255,255,.12);color:#fff;font:inherit;text-align:center;width:220px;user-select:text;-webkit-user-select:text}
.lbs{display:flex;gap:8px;margin-top:10px;max-width:340px;width:100%;font-size:12px;text-align:left}.lb{flex:1;background:rgba(255,255,255,.1);border-radius:10px;padding:6px 8px}.lb b{display:block;margin-bottom:2px}
#bar #bo{background:linear-gradient(#bc78f7,#6a2fb5)}#bar #bo.rdy{box-shadow:0 5px 0 rgba(0,0,0,.4),0 0 18px #c58cff,inset 0 1px 0 rgba(255,255,255,.4)}
.ov.cover{background:linear-gradient(180deg,#0f1a33 0%,#3b2a5e 48%,#e8794a 100%);justify-content:flex-start;padding-top:6vh;overflow-x:hidden;overflow-y:auto}
.ov.cover::before{content:'';position:absolute;left:50%;bottom:28%;width:52vmin;height:52vmin;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#ffe2a0,#ff8a4b 58%,transparent 70%);opacity:.85}
.cv-road{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#2b2f38,#12141a);clip-path:polygon(43% 0,57% 0,100% 100%,0 100%)}

.cv-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%}
.cv-tag{font-size:12px;letter-spacing:.2em;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.cv-t{margin:12px 0 6px;font-size:clamp(36px,11vw,58px);font-weight:900;line-height:1.12;letter-spacing:.04em;color:#ffe45e;-webkit-text-stroke:2px #8a1a14;paint-order:stroke fill;text-shadow:0 4px 0 #c0392b,0 12px 26px rgba(0,0,0,.55)}
.cv-s{font-size:14px;opacity:.92;margin:0 0 6px}.cv-h{font-size:11px;opacity:.7;max-width:280px;line-height:1.5}
.cover #st{background:linear-gradient(#ffd23a,#f08a1a);color:#3a1500;font-size:20px;padding:12px 44px;border-radius:999px;box-shadow:0 5px 0 #a85b0a,0 12px 22px rgba(0,0,0,.4)}
.cv-f{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;letter-spacing:.15em;color:#fff;opacity:.85;z-index:2;text-shadow:0 1px 3px #000}
#fl{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .35s;pointer-events:none}
#pb{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border:0;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;font-size:20px;cursor:pointer}
#bar{display:flex;gap:8px;padding:10px 10px 12px;background:linear-gradient(#222b38,#161c25);justify-content:center;border-top:1px solid rgba(255,255,255,.12)}
#bar button{flex:1;min-width:0;max-width:140px;height:62px;border:0;border-radius:18px;color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.4),0 8px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4);text-shadow:0 1px 2px rgba(0,0,0,.45);transition:transform .06s,box-shadow .06s,filter .06s}
#bar button::after{content:'';position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
#bar button b{font-size:24px;line-height:1}#bar button i{font-style:normal;font-size:12px;font-weight:700;letter-spacing:.06em}
#bar button.on,#bar button:active{transform:translateY(4px);filter:brightness(1.18);box-shadow:0 1px 0 rgba(0,0,0,.4),inset 0 3px 8px rgba(0,0,0,.35)}
#bar #bl,#bar #br{background:linear-gradient(#5b86ff,#2447c9)}#bar #hk{background:linear-gradient(#ffa25f,#e0502c)}#bar #bk{background:linear-gradient(#f06a5a,#a82418)}#bar #gs{background:linear-gradient(#45dc8e,#1b8f4f)}
button:focus-visible{outline:3px solid #f2c230;outline-offset:2px}
@media (max-width:600px){
#hud{font-size:15px;padding:8px 10px}
#lt{top:36px;font-size:19px}
#stage #mm{width:96px!important;height:96px!important;top:40px;left:8px}
#mmh{top:140px;left:2px;width:108px;font-size:10px}
#cw{top:70px;left:114px;right:8px;transform:none;width:auto;max-width:none;font-size:14px;padding:4px 10px;border-radius:12px;text-align:left}
#mc{top:126px;left:114px;right:8px;transform:none;width:auto;padding:6px}
#mc button{font-size:13px;padding:7px 8px}
#toast{top:30%;font-size:21px;padding:0 14px}
#ms{left:8px;bottom:8px;transform:none;max-width:calc(100% - 66px);font-size:12.5px;padding:5px 10px;line-height:1.4}
#bar{gap:5px;padding:8px 6px 10px}
#bar button{height:56px;border-radius:14px}#bar button b{font-size:20px}#bar button i{font-size:11px}
.ov h1{font-size:24px}.rep{font-size:13px}
}
@media (max-height:520px) and (orientation:landscape){
#hud{font-size:14px;padding:5px 10px}
#lt{top:28px;font-size:17px}
#stage #mm{width:84px!important;height:84px!important;top:30px;left:8px}
#mmh{display:none}
#cw{top:30px;left:auto;right:8px;transform:none;width:auto;max-width:44%;font-size:13px;padding:3px 10px;border-radius:12px}
#mc{top:30px;left:100px;right:auto;transform:none;width:min(40%,360px);padding:5px}
#mc button{font-size:12px;padding:5px 8px;margin-top:3px}
#toast{top:16%;font-size:19px}
#ms{left:auto;right:60px;bottom:6px;transform:none;max-width:44%;max-height:60%;overflow:hidden;font-size:12px;padding:4px 9px}
#bar{padding:4px 6px 5px;gap:5px}
#bar button{height:44px;max-width:120px;border-radius:12px;flex-direction:row;gap:5px}#bar button b{font-size:18px}#bar button i{font-size:11px}
.ov.cover{padding-top:2vh}.cv-t{font-size:30px;margin:6px 0}.cv-s{margin:0}.ov.cover::before{display:none}
#stage #bigmap{height:min(78vh,640px)!important}#maplist{max-height:78vh}
}

</style>
</head>
<body>
<div id="stage">
<div id="hud"><span id="sc">0 分</span><span id="sp">0 km/h</span><span id="nm">驚險 0</span></div><div id="lt"></div><div id="cw"></div><div id="ms"></div><div id="mc"></div>
<div id="toast"></div><div id="fl"></div><canvas id="mm" width="120" height="120"></canvas><div id="mmh">🔍 點小地圖看全圖（M）</div><div class="ov hide" id="mapov"><h1>🗺️ 前方 300 公尺路況</h1><p style="margin:0 0 8px;font-size:13px;opacity:.85">點地圖上的圖案，看它是什麼</p><div class="mpw"><div class="mpc"><canvas id="bigmap"></canvas><div id="mapinfo"><button id="mi-x" type="button" aria-label="關閉說明">✕</button><b id="mi-t"></b><div id="mi-p"></div><div id="mi-d"></div></div></div><div id="maplist"></div></div><button id="mapx" type="button">繼續開車</button></div><button id="pb" type="button" aria-label="暫停">⏸</button><div class="ov hide" id="pz"><h1>暫停中</h1><p>按 P 或點下面繼續</p><button id="rs" type="button">繼續</button></div>
<div class="ov cover" id="ov"><div class="cv-road"></div><div class="cv-in"><div class="cv-tag">3D 台灣街頭生存遊戲</div><h1 class="cv-t">台灣三寶<br>駕駛模擬器</h1><p class="cv-s">紅燈要停・老人要讓・救護車要閃</p><p class="big" id="bs"></p><input id="nk" maxlength="10" placeholder="輸入你的暱稱" autocomplete="off"><div class="lbs" id="lbs0"></div><button id="st" type="button">🏁 上路</button><p class="cv-h">W 油門・S 煞車・A D 轉向・空白 喇叭・E 彈射<br>小心 8+9、陣頭、違停、下雨天<br>任務：開進綠色取餐區，慢速通過就能取餐（猜單用 1/2/3 或點按鈕）<br>M 或點小地圖：看全圖<br>手機請用下方按鈕</p></div><div class="cv-f">陳品叡製作</div></div>
</div>
<div id="bar"><button id="bl" type="button" aria-label="向左"><b>◀</b><i>左轉</i></button><button id="br" type="button" aria-label="向右"><b>▶</b><i>右轉</i></button><button id="hk" type="button" aria-label="喇叭"><b>🔔</b><i>喇叭</i></button><button id="bk" type="button"><b>🛑</b><i>煞車</i></button><button id="gs" type="button"><b>⚡</b><i>油門</i></button><button id="bo" type="button"><b>🚀</b><i>彈射</i></button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var stage=document.getElementById('stage'),ov=document.getElementById('ov'),hk=document.getElementById('hk'),toastEl=document.getElementById('toast');
var MOB=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||Math.min(window.innerWidth,window.innerHeight)<600,mmF=0;
var renderer;
try{renderer=new THREE.WebGLRenderer({antialias:!MOB,powerPreference:'high-performance'});}catch(x){ov.innerHTML='<h1>無法顯示 3D</h1><p>這個瀏覽器不支援 WebGL。</p>';throw x}
var PF={n:0,acc:0,max:Math.min(window.devicePixelRatio||1,MOB?1.75:2),min:MOB?.75:1};PF.pr=Math.min(PF.max,MOB?1.25:2);renderer.setPixelRatio(PF.pr);
// 每 2 秒量一次幀率，太卡就降解析度，順就慢慢調回來
function perf(ms){if(!(ms>0&&ms<250)||paused)return;PF.acc+=ms;PF.n++;if(PF.acc<2000)return;var fps=1000*PF.n/PF.acc,np=PF.pr;PF.acc=PF.n=0;
  if(fps<45&&PF.pr>PF.min)np=Math.max(PF.min,PF.pr-.25);else if(fps>57&&PF.pr<PF.max)np=Math.min(PF.max,PF.pr+.25);if(np!==PF.pr){PF.pr=np;renderer.setPixelRatio(np);fit()}}
stage.insertBefore(renderer.domElement,stage.firstChild);
var scene=new THREE.Scene(),SKY=0xb9cbd8;
scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,25,90);
var cam=new THREE.PerspectiveCamera(65,1,.1,130);
scene.add(new THREE.HemisphereLight(0xffffff,0x778899,.95));
var sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(-20,40,10);scene.add(sun);
function fit(){var w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.fov=w/h<1?78:60;cam.updateProjectionMatrix()}
window.addEventListener('resize',fit);fit();
var G=new THREE.BoxGeometry(1,1,1),CG=new THREE.CylinderGeometry(.5,.5,1,14),SPG=new THREE.SphereGeometry(.5,12,10),CNG=new THREE.CylinderGeometry(0,.25,.7,8),PG=new THREE.PlaneGeometry(3,1.1),TG=new THREE.CylinderGeometry(.9,.9,1.6,10),MC={};
CG.rotateZ(Math.PI/2);
function mat(c,b){var k=c+(b?'b':'');return MC[k]||(MC[k]=b?new THREE.MeshBasicMaterial({color:c}):new THREE.MeshLambertMaterial({color:c}))}
function P(g,w,h,l,x,y,z,c,b){var m=new THREE.Mesh(G,mat(c,b));m.scale.set(w,h,l);m.position.set(x,y+h/2,z);g.add(m);return m}
function S(g,r,x,y,z,c){var m=new THREE.Mesh(SPG,mat(c));m.scale.set(r*2,r*2,r*2);m.position.set(x,y,z);g.add(m);return m}
function W(g,r,w,x,y,z,hub){var m=new THREE.Mesh(CG,mat('#1a1a1a'));m.scale.set(w,r*2,r*2);m.position.set(x,y,z);g.add(m);if(hub){var h=new THREE.Mesh(CG,mat('#c0c4cc'));h.scale.set(w+.03,r*1.1,r*1.1);h.position.set(x,y,z);g.add(h)}}
function bake(g){var by={};
  g.children.slice().forEach(function(m){
    if(!m.isMesh||m.userData.keep)return;
    m.updateMatrix();var geo=m.geometry.clone();geo.applyMatrix4(m.matrix);
    var o=by[m.material.uuid]||(by[m.material.uuid]={mat:m.material,geos:[]});o.geos.push(geo);g.remove(m)});
  Object.keys(by).forEach(function(k){var o=by[k],pos=[],nor=[],uv=[],idx=[],off=0;
    o.geos.forEach(function(geo){var p=geo.attributes.position,n=geo.attributes.normal,u=geo.attributes.uv,ix=geo.index,i;
      for(i=0;i<p.count;i++){pos.push(p.getX(i),p.getY(i),p.getZ(i));nor.push(n.getX(i),n.getY(i),n.getZ(i));uv.push(u.getX(i),u.getY(i))}
      if(ix)for(i=0;i<ix.count;i++)idx.push(ix.getX(i)+off);else for(i=0;i<p.count;i++)idx.push(i+off);
      off+=p.count});
    var bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));bg.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));bg.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));bg.setIndex(idx);g.add(new THREE.Mesh(bg,o.mat))})}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function carB(g,c,suv){var hh=suv?.35:0;
  P(g,1.85,.5,4.3,0,.3,0,c);P(g,1.8,.14,1.3,0,.8,-1.5,c);P(g,1.8,.14,.8,0,.8,1.7,c);
  P(g,1.64,.58+hh,2.3,0,.8,.1,'#26323f');P(g,1.66,.56+hh,.1,0,.82,.2,c);P(g,1.5,.07,1.9,0,1.38+hh,.12,c);
  P(g,1.9,.2,.14,0,.22,-2.2,'#222');P(g,1.9,.2,.14,0,.22,2.2,'#222');P(g,.45,.12,.05,0,.38,2.19,'#fff');
  [-1,1].forEach(function(s){P(g,.38,.16,.08,s*.65,.58,-2.17,'#ffffcc',1);P(g,.42,.13,.08,s*.7,.6,2.17,'#ff3030',1);P(g,.12,.1,.22,s*1.0,.98,-.55,c);
    W(g,.34,.24,s*.93,.34,-1.4,1);W(g,.34,.24,s*.93,.34,1.4,1)})}
function scootB(g,c,box,rd,br){
  W(g,.27,.12,0,.27,-.62);W(g,.27,.12,0,.27,.62);
  P(g,.44,.08,.8,0,.3,-.12,c);P(g,.46,.42,.75,0,.38,.5,c);P(g,.42,.62,.14,0,.3,-.58,c);
  P(g,.06,.55,.06,0,.25,-.62,'#555');P(g,.7,.06,.06,0,.98,-.52,'#222');P(g,.3,.16,.1,0,.82,-.68,'#ffffcc',1);
  P(g,.34,.1,.1,0,.6,.92,'#ff3030',1);P(g,.34,.1,.7,0,.78,.4,'#222');
  if(rd!==0){var sh=pick(['#e05a5a','#5aa0e0','#e0c35a','#6bbf7a','#444','#e8e8e8']);
