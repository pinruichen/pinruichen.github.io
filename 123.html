// 找不到關鍵字時的回答
const fallback = "問一點我能回答的問題可以嗎?傻逼";

function send(preset) {
  const box = document.getElementById("box");
  const text = (preset || box.value).trim();
  if (text === "") return;
  addMsg(text, "me");
  box.value = "";

  const typing = showTyping();
  setTimeout(function () {
    typing.remove();
    addMsg(getReply(text), "bot");
  }, 600 + Math.random() * 500);
}

function getReply(text) {
  const t = text.toLowerCase().trim();

  if (["好", "ok", "喔", "嗯", "好喔", "w"].includes(t)) {
    return "喔是喔是喔是喔是喔。";
  }

  function hit(k) {
    k = k.toLowerCase();
    if (/^[a-z0-9_]{1,3}$/.test(k)) {
      return new RegExp("(^|[^a-z0-9_])" + k + "($|[^a-z0-9_])").test(t);
    }
    return t.includes(k);
  }

  // 前兩條（感情、薪水）是禁區，先擋
  for (const item of answers.slice(0, 2)) {
    if (item.keys.some(hit)) return item.reply;
  }

  // 其他：選命中的最長關鍵字
  let best = null, bestLen = 0;
  for (const item of answers.slice(2)) {
    for (const k of item.keys) {
      if (hit(k) && k.length > bestLen) { best = item; bestLen = k.length; }
    }
  }
  return best ? best.reply : fallback;
}

function addMsg(text, who) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "bot typing";
  div.innerHTML = "<span></span><span></span><span></span>";
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
