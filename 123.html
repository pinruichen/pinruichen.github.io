// 找不到關鍵字時的回答
const fallback = "喔是喔是喔是喔是喔，你問這個我哪知道。";

function send(preset) {
  const box = document.getElementById("box");
  const text = (preset || box.value).trim();
  if (text === "") return;
  addMsg(text, "me");
  box.value = "";

  const typing = showTyping();
  setTimeout(function () {
    typing.remove();
    addMsg(getReply(text), "bot");
  }, 600 + Math.random() * 500);
}

function getReply(text) {
  const t = text.toLowerCase();

  // 太短的句子要完全一樣才算，避免誤中
  if (["好", "ok", "喔", "嗯", "好喔", "w"].includes(t)) {
    return "喔是喔是喔是喔是喔。";
  }

  for (const item of answers) {
    for (const k of item.keys) {
      if (t.includes(k.toLowerCase())) return item.reply;
    }
  }
  return fallback;
}

function addMsg(text, who) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "bot typing";
  div.innerHTML = "<span></span><span></span><span></span>";
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

  b.textContent = q;

  chipsBox.appendChild(b);
});

  { keys: ["你是ai", "你是機器人", "是真人", "真人嗎", "ai嗎", "機器人"], reply: "對，我是阿品的 AI 分身，其實是他自己用 Notepad++ 一行一行寫的，我根本神。" },
  { keys: ["誰做的", "誰寫的", "怎麼做的", "你怎麼運作", "怎麼寫"], reply: "阿品自己寫的，用 Notepad++，我根本神？" },

  // ===== 嗆人的 =====
  { keys: ["笨", "白癡", "智障", "爛", "廢物", "垃圾"], reply: "你在屌什麼，確定要跟我比嘴賤嗎？" },
  { keys: ["哈哈", "笑死", "好笑", "xd"], reply: "笑點在哪" }
  { keys: ["幹你娘", "幹", "可憐", "廢物"], reply: "你確定要跟我嘴砲^_^?" }
];

// 找不到關鍵字時的回答
const fallback = "問一點我能回答的問題可以嗎?傻逼";

function send(preset) {
  const box = document.getElementById("box");
  const text = (preset || box.value).trim();
  if (text === "") return;
  addMsg(text, "me");
  box.value = "";

  const typing = showTyping();
  setTimeout(function () {
    typing.remove();
    addMsg(getReply(text), "bot");
  }, 600 + Math.random() * 500);
}

function getReply(text) {
  const t = text.toLowerCase();

  // 太短的句子要完全一樣才算，避免誤中
  if (["好", "ok", "喔", "嗯", "好喔", "w"].includes(t)) {
    return "喔是喔是喔是喔是喔。";
  }

  for (const item of answers) {
    for (const k of item.keys) {
      if (t.includes(k.toLowerCase())) return item.reply;
    }
  }
  return fallback;
}

function addMsg(text, who) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "bot typing";
  div.innerHTML = "<span></span><span></span><span></span>";
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

// 範例問題按鈕
const examples = ["你是誰？", "你會什麼？", "愛吃什麼？", "聽什麼歌？", "你有女朋友嗎？", "怎麼聯絡你？"];
const chipsBox = document.getElementById("chips");
examples.forEach(function (q) {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = q;
  b.onclick = function () { send(q); };
  chipsBox.appendChild(b);
});

// 開場白
addMsg("喔，還真的有人來？我是阿品的分身，要問什麼快問，不要浪費我時間。", "bot");
